name: Release

# 推送 v* 标签（如 v0.2.0）时构建 Windows 与 macOS 安装包并发布到 GitHub Releases。
# 也可以在 Actions 页面手动运行，只构建产物而不发布。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$crate" ]]; then
              echo "::error::Tag v$tag does not match Cargo.toml version $crate"
              exit 1
            fi
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/CFBest.exe "dist/CFBest-${{ needs.version.outputs.version }}-windows-x64.exe"
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle CF Best.app
        run: |
          app="dist/CF Best.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/CFBest" \
            target/aarch64-apple-darwin/release/CFBest \
            target/x86_64-apple-darwin/release/CFBest
          cp assets/app-icon.icns "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CF Best</string>
            <key>CFBundleDisplayName</key><string>CF Best</string>
            <key>CFBundleIdentifier</key><string>com.aigcfree.cfbest</string>
            <key>CFBundleExecutable</key><string>CFBest</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          # 未使用开发者证书，做 ad-hoc 签名，Apple 芯片上才能启动。
          codesign --force --deep --sign - "$app"
      - name: Create DMG
        run: |
          ln -s /Applications dist/Applications
          hdiutil create -volname "CF Best" -srcfolder dist -ov -format UDZO \
            "CFBest-${VERSION}-macos-universal.dmg"
          mkdir out && mv "CFBest-${VERSION}-macos-universal.dmg" out/
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: out/*

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: CF Best v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
